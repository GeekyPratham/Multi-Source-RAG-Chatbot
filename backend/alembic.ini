# Alembic configuration file for InsightAgent AI API
# Database URL is read from the DATABASE_URL environment variable.
# Never hardcode database credentials here.

[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "version" column
# version_length = 32

# locale used when rendering the date
# in migration files.
# locale = en_US.UTF-8

# template used to generate migration files
# The default uses ${rev} as a placeholder for the revision id.
# version_template = %(rev)s_%(slug)s

# set to true to run migrations in the context of a transaction
# transaction_per_migration = true

# set to false to render batch mode for SQLite
# render_as_batch = false

# set to true to render type objects with type_()
# sql_type = false

# env.py loads DATABASE_URL from the environment or backend/.env and configures
# the SQLAlchemy URL at runtime.

# version location
version_locations = alembic/versions

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S